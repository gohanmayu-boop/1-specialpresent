<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
    :root{
      --gold-hi:#f7e3a6;
      --gold:#d1a94a;
      --gold-deep:#8a6415;
      --maroon:#5c1414;
      --red-hi:#e2483a;
      --red:#b5241c;
      --red-deep:#6e0f0c;
      --paper:#0a0908;
    }
    *{box-sizing:border-box;}
    body{margin:0;background:#000;}
    .page{
      position:relative;
      font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif;
      color:#f4ecd8;
      background:var(--paper);
    }
    .page-content{position:relative;z-index:1;}
    .list-glow{
      position:absolute;
      width:min(26vw,220px);
      height:440px;
      background-repeat:no-repeat;
      background-size:cover;
      opacity:0.92;
      pointer-events:none;
      -webkit-mask-image:linear-gradient(to bottom, transparent 0%, #000 30%, #000 70%, transparent 100%);
      mask-image:linear-gradient(to bottom, transparent 0%, #000 30%, #000 70%, transparent 100%);
    }
    .list-glow.side-left{left:0;background-image:url(edge-left.jpg);background-position:center left;}
    .list-glow.side-right{right:0;background-image:url(edge-right.jpg);background-position:center right;}
    .serif{font-family:"Shippori Mincho",serif;}
    img{max-width:100%;display:block;}
    a{text-decoration:none;}
    .hero{
      position:relative;
      overflow:hidden;
      text-align:center;
      padding:40px 20px 44px;
      background:transparent;
    }
    .hero-banner{
      display:block;
      width:100%;
      max-width:640px;
      margin:0 auto;
      border-radius:2px;
      box-shadow:0 18px 40px rgba(0,0,0,0.55);
      -webkit-mask-image:linear-gradient(to bottom, transparent 0%, #000 7%, #000 93%, transparent 100%);
      mask-image:linear-gradient(to bottom, transparent 0%, #000 7%, #000 93%, transparent 100%);
    }
    .hero-copy{
      position:relative;
      max-width:600px;
      margin:10px auto 0;
      font-family:"Shippori Mincho",serif;
      font-weight:600;
      font-size:clamp(17px,3.2vw,22px);
      line-height:1.9;
      color:#f9f4e6;
      letter-spacing:.02em;
    }
    .pill-btn{
      display:block;
      width:100%;
      max-width:480px;
      margin:0 auto;
      padding:5px;
      border-radius:999px;
      background:linear-gradient(135deg,
        #fffaea 0%, #f3dfa0 10%, #a97c1f 22%, #f7e3a6 34%,
        #8a6415 48%, #fff3d2 60%, #b5892f 72%, #f3dfa0 86%, #caa03c 100%);
      box-shadow:0 10px 24px rgba(0,0,0,0.5);
    }
    .pill-inner{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      background:linear-gradient(180deg,var(--red-hi) 0%, var(--red) 55%, var(--red-deep) 100%);
      box-shadow:0 0 0 1px rgba(0,0,0,0.4) inset;
      border-radius:999px;
      padding:16px 28px;
      color:#fff8e6;
      font-weight:900;
      font-size:clamp(15px,2.6vw,18px);
      letter-spacing:.04em;
      text-shadow:1px 1px 0 #4a0705,-1px -1px 0 #4a0705,1px -1px 0 #4a0705,-1px 1px 0 #4a0705;
    }
    .pill-btn:hover .pill-inner{filter:brightness(1.06);}
    .pill-inner .arrow{
      width:0;height:0;
      border-top:7px solid transparent;
      border-bottom:7px solid transparent;
      border-left:11px solid #fff8e6;
      filter:drop-shadow(1px 0 0 #4a0705);
    }
    .cta-note{margin:14px 0 0;font-size:11.5px;color:#a99a78;letter-spacing:.02em;text-align:center;}
    .list{position:relative;max-width:640px;margin:0 auto;padding:44px 20px 90px;background:transparent;}
    .item{position:relative;z-index:1;}
    .item .pill-inner{
      font-family:"Shippori Mincho",serif;
      font-weight:800;
      font-size:clamp(20px,4.9vw,27px);
      letter-spacing:.02em;
      padding:12px 14px;
      text-shadow:none;
    }
    .item .pill-inner .arrow{
      border-top-width:8px;
      border-bottom-width:8px;
      border-left-width:13px;
      filter:none;
    }
    .item{padding:26px 0 34px;border-bottom:1px solid rgba(255,255,255,0.35);}
    .item:last-child{border-bottom:none;}
    .thumb{
      position:relative;
      width:100%;
      aspect-ratio:190/134;
      background:
        radial-gradient(120% 140% at 20% 0%, rgba(209,169,74,0.14), transparent 60%),
        linear-gradient(160deg,#1c1712,#0c0a08);
      border:3px solid rgba(209,169,74,0.55);
      display:flex;
      align-items:center;
      justify-content:center;
      margin-bottom:16px;
    }
    .thumb svg.icon{width:34px;height:34px;stroke:rgba(209,169,74,0.55);z-index:1;}
    .thumb-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;}
    @media (max-width:480px){
      .pill-inner{padding:14px 16px;}
    }
</style>
</head>
